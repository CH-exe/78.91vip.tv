<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>访问验证</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    main {
      width: 280px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input,
    button {
      height: 36px;
      padding: 0 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <main>
    <h1>访问验证</h1>
    <form id="gateForm">
      <input id="gatePassword" type="password" placeholder="请输入密码" autocomplete="off" />
      <button type="submit">登录</button>
    </form>
  </main>

  <script>
    const PASSWORD = "Hglp2501";
    const form = document.getElementById("gateForm");
    const input = document.getElementById("gatePassword");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (input.value === PASSWORD) {
        location.href = "home.html";
        return;
      }
      alert("密码错误，请重试。");
      input.select();
    });
  </script>
</body>
</html>
